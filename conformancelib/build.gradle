// conformancelib/build.gradle

plugins {
    id 'java-library'
    id 'eclipse'
    id 'org.gradlex.extra-java-module-info' version '1.14.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    modularity.inferModulePath.set(true)
    withSourcesJar()
}

repositories {
    mavenCentral()
    flatDir {
        dirs '../libs', 'build/libs'
    }
}

def getVersion = { ->
    File versionFile = file('src/main/resources/build.version')
    if (!versionFile.exists()) {
        throw new GradleException("Missing required version file: ${versionFile}")
    }
    versionFile.text.replaceAll("[\\n\\r\\t ]", "")
}

dependencies {
    api 'org.bouncycastle:bcpkix-jdk15on:1.66'
    api 'org.bouncycastle:bcprov-jdk15on:1.66'
    api 'commons-cli:commons-cli:1.4'
    api 'org.apache.commons:commons-csv:1.8'
    api 'commons-codec:commons-codec:1.15'
    api 'ch.qos.logback:logback-classic:1.3.0-alpha5'
    api 'ch.qos.logback:logback-core:1.3.0-alpha5'
    api 'org.apache.ibatis:ibatis-core:3.0'
    api 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    api 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
    api 'org.junit.jupiter:junit-jupiter-params:5.7.0'
    api 'org.junit.platform:junit-platform-launcher:1.7.0'
    api 'junit:junit:4.13'
    api 'info.picocli:picocli:3.6.0'

    implementation 'gov.gsa:gov.gsa.pivconformance.cardlib:' + getVersion()
    runtimeOnly 'org.xerial:sqlite-jdbc:3.34.0'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.debugOptions.debugLevel = 'source,lines,vars'
    options.compilerArgs += [
        '--add-exports',
        'org.junit.platform.commons/org.junit.platform.commons.util=gov.gsa.pivconformance.conformancelib'
    ]
}

test {
    testClassesDirs = sourceSets.main.output.classesDirs
    classpath = sourceSets.main.runtimeClasspath
    useJUnitPlatform {
        includeTags 'Sun'
        excludeTags 'PIN', 'Card', 'BC', 'ExternalCertificateFixture'
    }
    jvmArgs '--add-exports=org.junit.platform.commons/org.junit.platform.commons.util=gov.gsa.pivconformance.conformancelib'
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.withType(Test).configureEach {
    def isolatedWorkingDirectory = layout.buildDirectory.dir("test-work/${name}")
    workingDir isolatedWorkingDirectory
    doFirst {
        File directory = isolatedWorkingDirectory.get().asFile
        directory.deleteDir()
        if (!directory.mkdirs() && !directory.isDirectory()) {
            throw new GradleException("Unable to create isolated test working directory: ${directory}")
        }
    }
}

tasks.register('certificateFixtureTest', Test) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Runs certificate-path validation tests that require the external certificate fixture set.'
    testClassesDirs = sourceSets.main.output.classesDirs
    classpath = sourceSets.main.runtimeClasspath
    systemProperty 'cct.certificateFixtureDir',
            layout.projectDirectory.dir('src/main/resources/x509-certs/valid').asFile.absolutePath
    useJUnitPlatform {
        includeTags 'ExternalCertificateFixture'
    }
    jvmArgs '--add-exports=org.junit.platform.commons/org.junit.platform.commons.util=gov.gsa.pivconformance.conformancelib'
    shouldRunAfter test
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

jar {
    version = getVersion()
    manifest {
        attributes(
            'Manifest-Version': '1.0',
            'Created-By': 'General Services Administration',
            'Automatic-Module-Name': 'gov.gsa.pivconformance.conformancelib',
            'Multi-Release': 'false',
            'Implementation-Title': 'gov.gsa.pivconformance.conformancelib',
            'Implementation-Version': getVersion(),
            'Implementation-Vendor': 'General Services Administration',
            'Bundle-ManifestVersion': '1',
            'Bundle-SymbolicName': 'gov.gsa.pivconformance.conformancelib',
            'Bundle-Name': 'gov.gsa.pivconformance.conformancelib',
            'Bundle-Vendor': 'gov.gsa',
            'Bundle-RequiredExecutionEnvironment': 'JavaSE-17',
            'Export-Package': 'gov.gsa.pivconformance.conformancelib;version=' + getVersion() + ', gov.gsa.pivconformance.conformancelib.configuration;version=' + getVersion() + ', gov.gsa.pivconformance.conformancelib.junitoptions;version=' + getVersion() + ', gov.gsa.pivconformance.conformancelib.tests;version=' + getVersion() + ', gov.gsa.pivconformance.conformancelib.tools.junitoptions;version=' + getVersion() + ', gov.gsa.pivconformance.conformancelib.utilities;version=' + getVersion(),
            'Import-Package': '*',
            'Specification-Title': 'gov.gsa.pivconformance.conformancelib',
            'Specification-Version': getVersion(),
            'Specification-Vendor': 'General Services Administration',
            'Sealed': 'false'
        )
    }
}

extraJavaModuleInfo {
    automaticModule('com.payneteasy:ber-tlv', 'com.payneteasy')
    automaticModule('org.hamcrest:hamcrest-core', 'org.hamcrest')
    automaticModule('commons-cli:commons-cli', 'org.apache.commons.cli')
    automaticModule('org.apache.commons:commons-csv', 'org.apache.commons.csv')
    automaticModule('org.apache.ibatis:ibatis-core', 'org.apache.ibatis')
    automaticModule('org.xerial:sqlite-jdbc', 'org.xerial')
    automaticModule('javax.activation:activation', 'javax.activation')
    automaticModule('edu.washington.cs.types.checker:checker-framework', 'edu.washington.cs.types.checker')
}

tasks.register('installSource') {
    dependsOn sourcesJar
    doLast {
        copy {
            from sourcesJar
            into '../libs'
        }
    }
}

tasks.register('install') {
    dependsOn build
    doLast {
        copy {
            from jar
            into '../libs'
        }
    }
}
