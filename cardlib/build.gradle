// cardlib/build.gradle

plugins {
    id 'java-library'
    id 'org.gradlex.extra-java-module-info' version '1.14.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    modularity.inferModulePath.set(true)
    withSourcesJar()
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'build/libs', '../libs'
    }
}

def getVersion = { ->
    File versionFile = file('src/main/resources/build.version')
    if (!versionFile.exists()) {
        throw new GradleException("Missing required version file: ${versionFile}")
    }
    versionFile.text.replaceAll("[\\n\\r\\t ]", "")
}

dependencies {
    api 'ch.qos.logback:logback-classic:1.3.0-alpha5'
    api 'ch.qos.logback:logback-core:1.3.0-alpha5'
    api 'com.payneteasy:ber-tlv:1.0-11'
    api 'com.sun.mail:javax.mail:1.6.2'
    api 'commons-cli:commons-cli:1.4'
    api 'commons-codec:commons-codec:1.15'
    api 'edu.washington.cs.types.checker:checker-framework:1.7.0'
    api 'javax.activation:activation:1.1'
    api 'org.apache.commons:commons-csv:1.8'
    api 'org.apiguardian:apiguardian-api:1.1.0'
    api 'org.bouncycastle:bcpkix-jdk15on:1.66'
    api 'org.bouncycastle:bcprov-jdk15on:1.66'
    api 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    api 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
    api 'org.junit.jupiter:junit-jupiter-params:5.7.0'
    api 'org.junit.platform:junit-platform-commons:1.7.0'
    api 'org.junit.platform:junit-platform-engine:1.7.0'
    api 'org.opentest4j:opentest4j:1.2.0'
    api 'org.slf4j:slf4j-api:2.0.0-alpha1'
    api 'org.xerial:sqlite-jdbc:3.32.3.2'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.debugOptions.debugLevel = 'source,lines,vars'
}

test {
    useJUnitPlatform {
        excludeTags 'Hardware'
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.register('hardwareTest', Test) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Runs tests that require a PC/SC reader and physical PIV card.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'Hardware'
        excludeTags 'PIN'
    }
    shouldRunAfter test
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.register('pinHardwareTest', Test) {
    group = LifecycleBasePlugin.VERIFICATION_GROUP
    description = 'Runs explicitly opted-in PIN interaction tests against an approved lab/test card.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'PIN'
    }
    shouldRunAfter hardwareTest
    // Do not persist or fingerprint the PIN as a Gradle input; always execute
    // this opt-in lane so a prior skipped/run result cannot be reused.
    outputs.upToDateWhen { false }
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.withType(Test).configureEach {
    def isolatedWorkingDirectory = layout.buildDirectory.dir("test-work/${name}")
    workingDir isolatedWorkingDirectory
    doFirst {
        File directory = isolatedWorkingDirectory.get().asFile
        directory.deleteDir()
        if (!directory.mkdirs() && !directory.isDirectory()) {
            throw new GradleException("Unable to create isolated test working directory: ${directory}")
        }
    }
}

def generatedVersionResources = layout.buildDirectory.dir('generated/version-resources')

tasks.register('generateVersionProperties') {
    def outputFile = generatedVersionResources.map {
        it.file('gov/gsa/pivconformance/cardlib/utils/version.properties')
    }
    outputs.file(outputFile)
    doLast {
        def repositoryDir = project.rootDir.parentFile
        def commitId = System.getenv('CCT_GIT_COMMIT') ?:
                ['git', 'rev-parse', '--short', 'HEAD'].execute(null, repositoryDir).text.trim()
        def commitDateText = System.getenv('CCT_GIT_COMMIT_EPOCH') ?:
                ['git', 'show', '-s', '--format=%ct', 'HEAD'].execute(null, repositoryDir).text.trim()
        def propertiesFile = outputFile.get().asFile
        propertiesFile.parentFile.mkdirs()

        Properties versionProperties = new Properties()
        versionProperties.setProperty('git.commit.time',
                new Date(Long.parseLong(commitDateText) * 1000L).format('dd.MM.yy HH.mm.ss'))
        versionProperties.setProperty('build.time', new Date().format('dd.MM.yy HH.mm.ss'))
        versionProperties.setProperty('git.commit.id', commitId)
        versionProperties.setProperty('build.version', getVersion())
        propertiesFile.withWriter { writer -> versionProperties.store(writer, null) }
    }
}

sourceSets.main.resources {
    srcDir(generatedVersionResources)
    exclude { details -> details.relativePath.pathString == 'version.properties' }
}
processResources.dependsOn generateVersionProperties
sourcesJar.dependsOn generateVersionProperties

jar {
    version = getVersion()
    manifest {
        attributes(
            'Manifest-Version': '1.0',
            'Created-By': 'General Services Administration',
            'Automatic-Module-Name': 'gov.gsa.pivconformance.cardlib',
            'Multi-Release': 'false',
            'Implementation-Title': 'gov.gsa.pivconformance.cardlib',
            'Implementation-Version': getVersion(),
            'Implementation-Vendor': 'General Services Administration',
            'Bundle-ManifestVersion': '1',
            'Bundle-SymbolicName': 'gov.gsa.pivconformance.cardlib',
            'Bundle-Name': 'gov.gsa.pivconformance.cardlib',
            'Bundle-Vendor': 'gov.gsa',
            'Bundle-RequiredExecutionEnvironment': 'JavaSE-17',
            'Export-Package': 'gov.gsa.pivconformance.cardlib;version=' + getVersion() + ', gov.gsa.pivconformance.cardlib.card.client;version=' + getVersion() + ', gov.gsa.pivconformance.cardlib.tlv;version=' + getVersion() + ', gov.gsa.pivconformance.cardlib.tools;version=' + getVersion() + ', gov.gsa.pivconformance.cardlib.utils;version=' + getVersion() + ', gov.gsa.pivconformance.cardlib.utilities;version=' + getVersion(),
            'Import-Package': '*',
            'Specification-Title': 'gov.gsa.pivconformance.cardlib',
            'Specification-Version': getVersion(),
            'Specification-Vendor': 'General Services Administration',
            'Sealed': 'false'
        )
    }
}

extraJavaModuleInfo {
    automaticModule('com.payneteasy:ber-tlv', 'com.payneteasy')
    automaticModule('org.hamcrest:hamcrest-core', 'org.hamcrest')
    automaticModule('org.xerial:sqlite-jdbc', 'org.xerial')
    automaticModule('commons-cli:commons-cli', 'org.apache.commons.cli')
    automaticModule('org.apache.commons:commons-csv', 'org.apache.commons.csv')
    automaticModule('javax.activation:activation', 'javax.activation')
    automaticModule('edu.washington.cs.types.checker:checker-framework', 'edu.washington.cs.types.checker')
    automaticModule('org.apache.ibatis:ibatis-core', 'org.apache.ibatis')
}

tasks.register('installSource') {
    dependsOn sourcesJar
    doLast {
        copy {
            from sourcesJar
            into '../libs'
        }
    }
}

tasks.register('install') {
    dependsOn jar
    doLast {
        copy {
            from jar
            into '../libs'
        }
    }
}
