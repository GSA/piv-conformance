// 85b-swing-gui/build.gradle

plugins {
    id 'java-library'
    id 'application'
    id 'eclipse'
    id 'com.gradleup.shadow' version '8.3.10'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

application {
    mainClass = 'gov.gsa.pivconformance.gui.GuiRunnerApplication'
}

repositories {
    mavenCentral()
    flatDir {
        dirs '../../libs', '../../cardlib/build/libs', '../../conformancelib/build/libs'
    }
}

def getVersion = { ->
    File versionFile = file('src/main/resources/build.version')
    if (!versionFile.exists()) {
        throw new GradleException("Missing required version file: ${versionFile}")
    }
    versionFile.text.replaceAll("[\\n\\r\\t ]", "")
}

version = getVersion()

dependencies {
    implementation 'com.formdev:flatlaf:3.7.2:no-natives'
    implementation 'commons-cli:commons-cli:1.4'
    implementation 'commons-codec:commons-codec:1.15'
    implementation 'org.apache.commons:commons-csv:1.8'
    implementation 'org.slf4j:slf4j-api:2.0.20'
    implementation 'ch.qos.logback:logback-classic:1.5.38'
    implementation 'ch.qos.logback:logback-core:1.5.38'
    implementation 'com.jgoodies:jgoodies-common:1.4.0'
    implementation 'com.jgoodies:jgoodies-forms:1.6.0'
    implementation 'gov.gsa.pivconformance.cardlib:gov.gsa.pivconformance.cardlib:' + getVersion()
    implementation 'gov.gsa.pivconformance.conformancelib:gov.gsa.pivconformance.conformancelib:' + getVersion()
    implementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    implementation 'org.junit.platform:junit-platform-launcher:1.7.0'
    implementation 'edu.washington.cs.types.checker:checker-framework:1.7.0'
    runtimeOnly 'com.payneteasy:ber-tlv:1.0-11'
    runtimeOnly 'com.sun.mail:javax.mail:1.6.2'
    runtimeOnly 'javax.activation:activation:1.1'
    runtimeOnly 'org.apache.ibatis:ibatis-core:3.0'
    runtimeOnly 'org.bouncycastle:bcpkix-jdk18on:1.86'
    runtimeOnly 'org.bouncycastle:bcprov-jdk18on:1.86'
    runtimeOnly 'info.picocli:picocli:3.6.0'
    runtimeOnly 'junit:junit:4.13.2'
    runtimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
    runtimeOnly 'org.junit.jupiter:junit-jupiter-params:5.7.0'
    runtimeOnly 'org.xerial:sqlite-jdbc:3.53.4.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.7.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.debugOptions.debugLevel = 'source,lines,vars'
}

test {
    systemProperty 'cct.repository', file('../..').absolutePath
    systemProperty 'cct.data.dir', layout.buildDirectory.dir('test-data').get().asFile.absolutePath
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

shadowJar {
    archiveFileName = 'gov.gsa.pivconformance.gui-' + getVersion() + '-shadow.jar'
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

tasks.register('installSource') {
    dependsOn sourcesJar
    doLast {
        copy {
            from sourcesJar
            into '../../libs'
        }
    }
}

tasks.register('install') {
    dependsOn shadowJar
    doLast {
        copy {
            from shadowJar
            into '../../libs'
        }
    }
}
