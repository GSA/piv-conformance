name: Windows package

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build and verify Windows x64 ZIP
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.20+101'
          architecture: x64
      - name: Build, package and verify with the bundled runtime
        shell: pwsh
        run: .\packaging\windows\package-windows.ps1 -SmokeTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cct-windows-x64
          path: |
            build/releases/windows-*/*.zip
            build/releases/windows-*/*.sha256
          if-no-files-found: error
          retention-days: 14
